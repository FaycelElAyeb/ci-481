name: Student CI Pipeline
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository code
        uses: actions/checkout@v5
      
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm install
      
      - name: Build project
        run: npm run build
      
      - name: Run tests
        run: npm test
